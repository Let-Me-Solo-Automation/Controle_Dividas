name: Compilar entrega privada
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: marks-private-build
  cancel-in-progress: true
jobs:
  build:
    if: github.event.repository.private == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: Marks-entrega-privada
          path: |
            dist/downloads/Marks-projeto.zip
            dist/downloads/Marks-Android.apk
            Visualizador.html
          retention-days: 30
