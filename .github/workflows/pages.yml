name: Retirar simulador do site público
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  retirar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Preparar página sem arquivos do aplicativo
        run: |
          mkdir -p dist
          printf '%s' '<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Conteúdo privado</title><p>O aplicativo foi retirado deste site. O projeto é disponibilizado somente pelo repositório privado.</p></html>' > dist/index.html
          touch dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Retirar downloads públicos
        id: deployment
        uses: actions/deploy-pages@v4
